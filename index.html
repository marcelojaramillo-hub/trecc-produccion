<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TRECC · Producción Evento</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap');
:root{
  --bg:#0f0e0c;--surface:#1a1916;--s2:#242220;--border:#2e2c28;
  --gold:#c9a84c;--gl:#e8c97a;--cream:#f0ebe0;--dim:#7a756c;
  --red:#d45f4a;--green:#5a9e72;--blue:#4a7db5;--ora:#c47c3a;
  --text:#e8e2d6;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;min-height:100vh;}
.hdr{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 20px 0;position:sticky;top:0;z-index:100;}
.hdr-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-bottom:8px;}
.hdr-title{font-family:'DM Serif Display',serif;font-size:22px;color:var(--gold);}
.hdr-sub{font-size:11px;color:var(--dim);margin-top:3px;letter-spacing:.08em;text-transform:uppercase;}
.hdr-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.prog-wrap{display:flex;align-items:center;gap:10px;}
.prog-lbl{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;}
.prog-bar{width:110px;height:6px;background:var(--border);border-radius:3px;overflow:hidden;}
.prog-fill{height:100%;background:var(--gold);border-radius:3px;transition:width .4s;}
.prog-pct{font-size:13px;font-weight:600;color:var(--gl);min-width:34px;}
.export-btn{background:linear-gradient(135deg,var(--gold),var(--gl));color:#000;border:none;border-radius:5px;padding:6px 14px;font-size:12px;font-weight:700;font-family:'DM Sans',sans-serif;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:5px;}
.export-btn:hover{filter:brightness(1.1);}
.tabs{display:flex;gap:0;}
.tab{padding:9px 18px 7px;font-size:13px;font-weight:500;color:var(--dim);cursor:pointer;border-bottom:3px solid transparent;transition:all .15s;white-space:nowrap;user-select:none;}
.tab:hover{color:var(--text);}
.tab.active{color:var(--gold);border-bottom-color:var(--gold);}
.tbadge{background:var(--red);color:#fff;border-radius:10px;padding:0 6px;font-size:10px;margin-left:4px;display:none;vertical-align:middle;}
.page{display:none;}
.page.on{display:block;}
.filters{display:flex;gap:6px;padding:8px 20px 9px;flex-wrap:wrap;align-items:center;border-top:1px solid var(--border);background:var(--surface);}
.fl{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);}
.fb{background:var(--s2);border:1px solid var(--border);color:var(--dim);border-radius:4px;padding:3px 10px;font-size:11px;font-family:'DM Sans',sans-serif;cursor:pointer;transition:all .15s;white-space:nowrap;}
.fb:hover{border-color:var(--gold);color:var(--gold);}
.fb.active{background:var(--gold);border-color:var(--gold);color:#000;font-weight:600;}
.fdiv{width:1px;height:18px;background:var(--border);margin:0 2px;}
/* TASKS */
.main{padding:16px 16px 60px;max-width:920px;margin:0 auto;}
.stats-bar{display:flex;gap:16px;padding:10px 0 14px;flex-wrap:wrap;}
.stat{display:flex;flex-direction:column;align-items:center;gap:2px;}
.stat-num{font-family:'DM Serif Display',serif;font-size:22px;line-height:1;}
.stat-label{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--dim);}
.section{margin-bottom:16px;border:1px solid var(--border);border-radius:8px;overflow:hidden;}
.section-header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px 8px;background:var(--surface);cursor:pointer;user-select:none;gap:8px;}
.section-header:hover{background:var(--s2);}
.section-left{display:flex;align-items:center;gap:8px;flex:1;flex-wrap:wrap;}
.section-date-badge{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border-radius:3px;white-space:nowrap;flex-shrink:0;}
.section-title{font-family:'DM Serif Display',serif;font-size:14px;color:var(--cream);}
.section-hora{font-size:11px;color:var(--gold);background:rgba(201,168,76,.1);border:1px solid rgba(201,168,76,.2);border-radius:3px;padding:2px 8px;white-space:nowrap;}
.section-hora-input{background:rgba(201,168,76,.08);border:1px solid rgba(201,168,76,.2);border-radius:3px;color:var(--gold);font-family:'DM Sans',sans-serif;font-size:11px;padding:2px 7px;outline:none;width:180px;}
.section-hora-input:focus{border-color:var(--gold);background:rgba(201,168,76,.15);}
.section-hora-input::placeholder{color:rgba(201,168,76,.4);}
.section-right{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.section-count{font-size:11px;color:var(--dim);}
.section-chevron{color:var(--dim);font-size:12px;transition:transform .2s;}
.section-chevron.open{transform:rotate(180deg);}
.section-body{display:none;}
.section-body.open{display:block;}
.task{display:flex;align-items:flex-start;gap:10px;padding:9px 14px;border-top:1px solid var(--border);}
.task:hover{background:rgba(255,255,255,.02);}
.task.done{opacity:.45;}
.task.hidden{display:none;}
.task-check{width:18px;height:18px;border-radius:4px;border:1.5px solid var(--border);cursor:pointer;flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;transition:all .15s;}
.task-check:hover{border-color:var(--green);}
.task-check.checked{background:var(--green);border-color:var(--green);}
.task-check.checked::after{content:'✓';font-size:11px;color:#fff;font-weight:700;}
.task-body{flex:1;min-width:0;}
.task-text{font-size:13px;line-height:1.45;color:var(--text);}
.task.done .task-text{text-decoration:line-through;color:var(--dim);}
.task-meta{display:flex;gap:5px;margin-top:4px;flex-wrap:wrap;}
.task-note{font-size:11px;color:var(--dim);font-style:italic;margin-top:3px;}
.tag{display:inline-block;font-size:10px;padding:2px 6px;border-radius:3px;font-weight:500;border:1px solid transparent;white-space:nowrap;cursor:pointer;}
.tag-marcelo{background:rgba(201,168,76,.15);color:var(--gl);border-color:rgba(201,168,76,.25);}
.tag-marine{background:rgba(74,125,181,.15);color:#7fb3e8;border-color:rgba(74,125,181,.25);}
.tag-moly{background:rgba(196,124,58,.15);color:#e0a06a;border-color:rgba(196,124,58,.25);}
.tag-catalina{background:rgba(90,158,114,.15);color:#85cc9e;border-color:rgba(90,158,114,.25);}
.tag-lina{background:rgba(180,100,180,.15);color:#d0a0d0;border-color:rgba(180,100,180,.25);}
.tag-marcela{background:rgba(212,95,74,.15);color:#e8907c;border-color:rgba(212,95,74,.25);}
.tag-andrea{background:rgba(100,180,200,.15);color:#80d0e0;border-color:rgba(100,180,200,.25);}
.tag-equipo,.tag-otro{background:rgba(120,120,120,.15);color:#aaa;border-color:rgba(120,120,120,.25);}
.tag-alta{background:rgba(212,95,74,.2);color:#e8907c;border-color:rgba(212,95,74,.3);}
.tag-media{background:rgba(196,124,58,.2);color:#e0a06a;border-color:rgba(196,124,58,.3);}
.tag-baja{background:rgba(90,158,114,.2);color:#85cc9e;border-color:rgba(90,158,114,.3);}
.tag-fam{background:rgba(74,125,181,.1);color:#7fb3e8;border-color:rgba(74,125,181,.2);}
.tag-foro{background:rgba(160,130,200,.1);color:#c0a8e8;border-color:rgba(160,130,200,.2);}
.tag-coctel{background:rgba(201,168,76,.1);color:var(--gold);border-color:rgba(201,168,76,.2);}
.tag-cena{background:rgba(90,158,114,.1);color:#85cc9e;border-color:rgba(90,158,114,.2);}
.tag-rueda{background:rgba(196,124,58,.1);color:#e0a06a;border-color:rgba(196,124,58,.2);}
.tag-almuerzo{background:rgba(180,100,100,.1);color:#e0a0a0;border-color:rgba(180,100,100,.2);}
.tag-stand{background:rgba(100,180,180,.1);color:#80d0d0;border-color:rgba(100,180,180,.2);}
.tag-logística{background:rgba(140,140,100,.1);color:#c0c080;border-color:rgba(140,140,100,.2);}
.add-task-row{display:flex;gap:6px;padding:7px 14px;border-top:1px solid var(--border);background:var(--surface);}
.add-task-input{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:4px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:12px;padding:5px 10px;outline:none;}
.add-task-input:focus{border-color:var(--gold);}
.add-task-input::placeholder{color:var(--dim);}
.add-btn{background:var(--gold);color:#000;border:none;border-radius:4px;padding:5px 12px;font-size:12px;font-weight:600;font-family:'DM Sans',sans-serif;cursor:pointer;}
.add-btn:hover{background:var(--gl);}
.date-22{background:rgba(74,125,181,.25);color:#7fb3e8;}
.date-23{background:rgba(90,158,114,.25);color:#85cc9e;}
.date-24{background:rgba(196,124,58,.25);color:#e0a06a;}
.date-25{background:rgba(160,130,200,.25);color:#c0a8e8;}
.date-26{background:rgba(201,168,76,.25);color:var(--gold);}
.date-27{background:rgba(212,95,74,.25);color:#e8907c;}
.date-28{background:rgba(100,180,180,.25);color:#80d0d0;}
.date-gen{background:rgba(140,140,140,.2);color:#aaa;}
/* COMMENTS */
.com-page{padding:20px 20px 60px;max-width:860px;margin:0 auto;}
.com-add-btn{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,rgba(201,168,76,.18),rgba(201,168,76,.06));border:2px dashed rgba(201,168,76,.45);border-radius:10px;padding:15px 20px;margin-bottom:18px;cursor:pointer;width:100%;text-align:left;transition:all .2s;}
.com-add-btn:hover{background:linear-gradient(135deg,rgba(201,168,76,.28),rgba(201,168,76,.1));border-color:var(--gold);}
.com-add-icon{font-size:26px;}
.com-add-title{font-family:'DM Serif Display',serif;font-size:17px;color:var(--gold);}
.com-add-sub{font-size:11px;color:var(--dim);margin-top:2px;}
.com-form{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:18px;display:none;}
.com-form.open{display:block;}
.com-form-title{font-family:'DM Serif Display',serif;font-size:15px;color:var(--gold);margin-bottom:10px;}
.com-row{display:flex;gap:7px;margin-bottom:7px;flex-wrap:wrap;}
.com-inp{background:var(--bg);border:1px solid var(--border);border-radius:4px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:12px;padding:5px 9px;outline:none;transition:border-color .15s;}
.com-inp:focus{border-color:var(--gold);}
.com-inp::placeholder{color:var(--dim);}
.com-ta{background:var(--bg);border:1px solid var(--border);border-radius:4px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:13px;padding:8px 10px;outline:none;width:100%;resize:vertical;min-height:68px;transition:border-color .15s;}
.com-ta:focus{border-color:var(--gold);}
.com-ta::placeholder{color:var(--dim);}
.com-filters{display:flex;gap:5px;margin-bottom:12px;flex-wrap:wrap;}
.com-empty{padding:38px;text-align:center;color:var(--dim);font-style:italic;}
.com-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;margin-bottom:9px;overflow:hidden;}
.com-card.oc{border-left:4px solid var(--red);}
.com-card.pc{border-left:4px solid var(--ora);}
.com-card.rc{border-left:4px solid var(--green);opacity:.68;}
.com-hdr{display:flex;align-items:center;gap:7px;padding:8px 12px;background:var(--s2);flex-wrap:wrap;}
.com-date{font-size:11px;font-weight:600;color:var(--gold);}
.com-body{padding:9px 12px 11px;}
.com-txt{font-size:13px;color:var(--text);line-height:1.55;margin-bottom:7px;white-space:pre-wrap;word-break:break-word;}
.com-edit-ta{background:var(--bg);border:1px solid var(--border);border-radius:4px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:13px;padding:7px 10px;outline:none;width:100%;resize:vertical;min-height:50px;display:none;margin-bottom:7px;}
.com-edit-ta:focus{border-color:var(--gold);}
.com-res-inp{background:var(--bg);border:1px solid var(--border);border-radius:4px;color:var(--dim);font-family:'DM Sans',sans-serif;font-size:11px;padding:4px 8px;outline:none;width:100%;margin-top:5px;transition:border-color .15s;}
.com-res-inp:focus{border-color:var(--green);color:var(--text);}
.com-actions{display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin-top:7px;}
.com-ss{background:var(--bg);border:1px solid var(--border);border-radius:4px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:11px;padding:3px 7px;cursor:pointer;outline:none;}
.com-ss option{background:#1a1916;}
.btn-e{background:rgba(201,168,76,.12);border:1px solid rgba(201,168,76,.2);color:var(--gold);border-radius:3px;padding:3px 9px;font-size:10px;cursor:pointer;font-family:'DM Sans',sans-serif;}
.btn-s{background:var(--gold);border:none;border-radius:3px;padding:3px 9px;font-size:10px;cursor:pointer;font-family:'DM Sans',sans-serif;color:#000;font-weight:600;display:none;}
.btn-c{background:rgba(120,120,120,.15);border:1px solid rgba(120,120,120,.25);color:#aaa;border-radius:3px;padding:3px 9px;font-size:10px;cursor:pointer;font-family:'DM Sans',sans-serif;display:none;}
.btn-d{background:rgba(212,95,74,.12);border:1px solid rgba(212,95,74,.2);color:var(--red);border-radius:3px;padding:3px 9px;font-size:10px;cursor:pointer;font-family:'DM Sans',sans-serif;margin-left:auto;}
.btn-d:hover{background:rgba(212,95,74,.25);}
.com-resolve{font-size:11px;color:#85cc9e;font-style:italic;margin-top:3px;}
.com-count{font-size:11px;color:var(--dim);margin-bottom:10px;}
@media(max-width:480px){.hdr-title{font-size:18px;}.main,.com-page{padding:12px 10px 60px;}}
</style>
</head>
<body>
<div class="hdr">
  <div class="hdr-top">
    <div>
      <div class="hdr-title">TRECC · Producción Evento</div>
      <div class="hdr-sub">Compas Urbano · Embajada de Francia · Mayo 2025</div>
    </div>
    <div class="hdr-right">
      <div class="prog-wrap">
        <span class="prog-lbl">Avance</span>
        <div class="prog-bar"><div class="prog-fill" id="globalBar" style="width:0%"></div></div>
        <span class="prog-pct" id="globalPct">0%</span>
      </div>
      <button class="export-btn" onclick="exportExcel()">⬇️ Exportar Excel</button>
    </div>
  </div>
  <div class="tabs">
    <div class="tab active" id="tab-tasks" onclick="showTab('tasks')">✅ Tareas</div>
    <div class="tab" id="tab-comments" onclick="showTab('comments')">💬 Comentarios <span class="tbadge" id="comBadge">0</span></div>
  </div>
  <div class="filters" id="taskFilters">
    <span class="fl">Ver:</span>
    <button class="fb active" onclick="fStatus('todos',this)">Todos</button>
    <button class="fb" onclick="fStatus('pendientes',this)">Pendientes</button>
    <button class="fb" onclick="fStatus('hechos',this)">Completados</button>
    <div class="fdiv"></div>
    <span class="fl">Resp:</span>
    <button class="fb" onclick="fResp('Marcelo')">Marcelo</button>
    <button class="fb" onclick="fResp('Marine')">Marine</button>
    <button class="fb" onclick="fResp('Moly')">Moly</button>
    <button class="fb" onclick="fResp('Catalina')">Catalina</button>
    <button class="fb" onclick="fResp('Lina')">Lina</button>
    <button class="fb" onclick="fResp('Marcela')">Marcela</button>
    <button class="fb" onclick="fResp('Andrea')">Andrea</button>
    <button class="fb" onclick="fResp('Equipo')">Equipo</button>
  </div>
</div>

<div class="page on" id="page-tasks">
  <div class="main">
    <div class="stats-bar">
      <div class="stat"><span class="stat-num" id="sTotal" style="color:var(--cream)">0</span><span class="stat-label">Total</span></div>
      <div class="stat"><span class="stat-num" id="sDone" style="color:var(--green)">0</span><span class="stat-label">Listas</span></div>
      <div class="stat"><span class="stat-num" id="sPend" style="color:var(--gold)">0</span><span class="stat-label">Pendientes</span></div>
      <div class="stat"><span class="stat-num" id="sAlta" style="color:var(--red)">0</span><span class="stat-label">Alta prioridad</span></div>
      <div class="stat"><span class="stat-num" id="sOpenCom" style="color:var(--ora)">0</span><span class="stat-label">Comentarios abiertos</span></div>
    </div>
    <div id="sectionsContainer"></div>
  </div>
</div>

<div class="page" id="page-comments">
  <div class="com-page">
    <button class="com-add-btn" onclick="toggleForm()">
      <span class="com-add-icon">✍️</span>
      <span><div class="com-add-title">Agregar comentario del día</div><div class="com-add-sub">Registra observaciones, problemas o acuerdos. Toca aquí.</div></span>
    </button>
    <div class="com-form" id="comForm">
      <div class="com-form-title">Nuevo comentario</div>
      <div class="com-row">
        <input class="com-inp" id="ncDate" type="date" style="width:140px;flex:0">
        <select class="com-inp" id="ncArea" style="width:160px;flex:0">
          <option>General</option><option>FAM Trip</option><option>Foro 27 Mayo</option>
          <option>Almuerzo</option><option>Rueda de Negocios</option><option>Cóctel 26 Mayo</option>
          <option>Cena Bureau</option><option>Stand / Logística</option><option>Invitados</option>
          <option>Traducción</option><option>Protocolo</option><option>Otro</option>
        </select>
        <select class="com-inp" id="ncResp" style="width:120px;flex:0">
          <option>Marcelo</option><option>Marine</option><option>Moly</option><option>Catalina</option>
          <option>Lina</option><option>Marcela</option><option>Andrea</option><option>Equipo</option>
          <option>ProAntioquia</option><option>Cámara CC</option><option>Bureau</option>
        </select>
        <select class="com-inp" id="ncPrio" style="width:110px;flex:0">
          <option value="alta">🔴 Alta</option>
          <option value="media" selected>🟡 Media</option>
          <option value="baja">🟢 Baja</option>
        </select>
      </div>
      <textarea class="com-ta" id="ncText" placeholder="¿Qué pasó? ¿Qué acordaste? ¿Qué problema hay?"></textarea>
      <div class="com-row" style="margin-top:9px;align-items:center;">
        <button class="add-btn" onclick="addComment()" style="padding:7px 18px;font-size:13px">💾 Guardar</button>
        <button class="fb" onclick="toggleForm()" style="margin-left:4px">Cancelar</button>
        <span style="font-size:11px;color:var(--dim);margin-left:8px">Se guarda en el navegador.</span>
      </div>
    </div>
    <div class="com-filters">
      <span class="fl">Filtrar:</span>
      <button class="fb active" onclick="fCom('all',this)">Todos</button>
      <button class="fb" onclick="fCom('abierto',this)">🔴 Abiertos</button>
      <button class="fb" onclick="fCom('en_proceso',this)">🟡 En proceso</button>
      <button class="fb" onclick="fCom('resuelto',this)">✅ Resueltos</button>
      <button class="fb" onclick="fCom('alta',this)">⚠️ Alta prioridad</button>
    </div>
    <div class="com-count" id="comCount"></div>
    <div id="comContainer"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0"></script>
<script>
const SECTIONS = [
  {
    id: 's_gen',
    date: 'General',
    dateClass: 'date-gen',
    title: 'Coordinación General del Proyecto',
    hora: '',
    tasks: [
      { text: 'Reunión diaria 8:30am con equipo Compas Urbano — revisar avance producción', resp: 'Marcelo', prio: 'alta', cat: 'logística', note: 'Todos los días hasta el 29 de mayo' },
      { text: 'Hacer guion completo del evento (27 mayo)', resp: 'Marine', prio: 'alta', cat: 'foro' },
      { text: 'Hacer encuadre con todos los ponentes del foro', resp: 'Marine', prio: 'alta', cat: 'foro' },
      { text: 'Doble check: confirmar que cada presentador tenga su PPT lista y correcta', resp: 'Marine', prio: 'alta', cat: 'foro' },
      { text: 'Contratar servicio de traducción simultánea (~20 personas con aparatos)', resp: 'Marcelo', prio: 'alta', cat: 'foro', note: 'Validar con Embajada si se necesita también para almuerzo' },
      { text: 'Comunicar a invitados recomendaciones de llegada', resp: 'Marine', prio: 'alta', cat: 'logística' },
      { text: 'Revisión de último momento: vuelos y hoteles de invitados especiales', resp: 'Marine', prio: 'alta', cat: 'logística' },
      { text: 'Alistar radios logísticos de coordinación', resp: 'Lina', prio: 'media', cat: 'logística' },

let lastSyncTime = 0;

async function syncToSupabase() {
  const now = Date.now();
  if(now - lastSyncTime < 2000) return;
  lastSyncTime = now;

  const dataToSync = COMMENTS.map(com => ({
    id: String(com.id).replace(/[^a-zA-Z0-9_-]/g, ''),
    fecha: com.fecha||'',
    area: com.area||'',
    texto: com.texto||'',
    responsable: com.resp||'',
    estado: com.status||'abierto',
    fecha_resolucion: com.fechaRes||null,
    resolucion: com.res||'',
    prioridad: com.prio||'media'
  }));

  try {
    await supabase.from('comentarios').upsert(dataToSync, { onConflict: 'id' });
    console.log('✓ Sincronizado a Supabase');
  } catch(e) {
    console.error('Error sync:', e.message);
  }
}

async function loadFromSupabase() {
  try {
    const result = await supabase.from('comentarios').select('*');
    const rows = result.data;
    if(rows && rows.length > 0) {
      COMMENTS = rows.map(c => ({
        id: c.id,
        fecha: c.fecha||'',
        area: c.area||'',
        texto: c.texto||'',
        resp: c.responsable||'',
        status: c.estado||'abierto',
        fechaRes: c.fecha_resolucion||'',
        res: c.resolucion||'',
        prio: c.prioridad||'media'
      }));
      saveComments();
      console.log('✓ Comentarios cargados desde Supabase:', COMMENTS.length);
    }
  } catch(err) {
    console.error('Error cargando de Supabase:', err.message);
  }
}

let statusFilter='todos', respFilter=null;

function buildSection(sec){
  const cont = document.getElementById('sectionsContainer');
  const div = document.createElement('div'); div.className='section'; div.id=sec.id;
  const hora = getHora(sec.id);
  const horaHtml = `<input class="section-hora-input" id="hora_${sec.id}" value="${hora}" placeholder="Agregar horario..." title="Horario del evento" onchange="setHora('${sec.id}',this.value)" onclick="event.stopPropagation()">`;
  const hdr = document.createElement('div'); hdr.className='section-header';
  hdr.innerHTML=`
    <div class="section-left">
      <span class="section-date-badge ${sec.dateClass}">${sec.date}</span>
      <span class="section-title">${sec.title}</span>
      ${horaHtml}
    </div>
    <div class="section-right">
      <span class="section-count" id="${sec.id}_count"></span>
      <span class="section-chevron open" id="${sec.id}_chev">▼</span>
    </div>`;
  hdr.onclick = (e)=>{ if(e.target.tagName!=='INPUT') toggleSection(sec.id); };
  div.appendChild(hdr);
  const body=document.createElement('div'); body.className='section-body open'; body.id=sec.id+'_body';
  sec.tasks.forEach((t,i)=>body.appendChild(buildTask(sec,t,i)));
  const ar=document.createElement('div'); ar.className='add-task-row';
  ar.innerHTML=`<input class="add-task-input" id="${sec.id}_inp" placeholder="+ Agregar tarea..." onkeydown="if(event.key==='Enter')addTask('${sec.id}')"><button class="add-btn" onclick="addTask('${sec.id}')">+</button>`;
  body.appendChild(ar); div.appendChild(body); cont.appendChild(div);
  updateSectionCount(sec.id);
}

function buildTask(sec,t,idx){
  const done=isTaskDone(sec.id,idx);
  const div=document.createElement('div');
  div.className='task'+(done?' done':'');
  div.id=sec.id+'_task_'+idx;
  div.dataset.resp=t.resp||''; div.dataset.prio=t.prio||''; div.dataset.done=done?'1':'0';
  const rCls=t.resp?'tag-'+t.resp.toLowerCase().replace(/ /g,'-'):'';
  const noteH=t.note?`<div class="task-note">↳ ${t.note}</div>`:'';
  div.innerHTML=`
    <div class="task-check ${done?'checked':''}" onclick="toggleTask('${sec.id}',${idx},this)"></div>
    <div class="task-body">
      <div class="task-text">${t.text}</div>${noteH}
      <div class="task-meta">
        ${t.resp?`<span class="tag ${rCls}" onclick="fResp('${t.resp}')">${t.resp}</span>`:''}
        ${t.prio?`<span class="tag tag-${t.prio}">${t.prio.charAt(0).toUpperCase()+t.prio.slice(1)}</span>`:''}
        ${t.cat?`<span class="tag tag-${t.cat.toLowerCase().replace(/ /g,'')}">${t.cat}</span>`:''}
      </div>
    </div>`;
  return div;
}

function toggleSection(id){
  const b=document.getElementById(id+'_body'),c=document.getElementById(id+'_chev');
  b.classList.toggle('open'); c.classList.toggle('open');
}
function toggleTask(sid,idx,el){
  const id=sid+'_t'+idx, nv=!taskState[id]; taskState[id]=nv; saveTasks();
  const t=document.getElementById(sid+'_task_'+idx);
  t.classList.toggle('done',nv); el.classList.toggle('checked',nv); t.dataset.done=nv?'1':'0';
  applyFilters(); updateSectionCount(sid); updateStats();
}
function addTask(sid){
  const inp=document.getElementById(sid+'_inp'),txt=inp.value.trim(); if(!txt) return;
  const sec=SECTIONS.find(s=>s.id===sid),idx=sec.tasks.length;
  sec.tasks.push({text:txt,resp:'Marcelo',prio:'media',cat:'logística'});
  const body=document.getElementById(sid+'_body');
  body.insertBefore(buildTask(sec,sec.tasks[idx],idx),body.querySelector('.add-task-row'));
  inp.value=''; applyFilters(); updateSectionCount(sid); updateStats();
}
function fStatus(v,btn){
  statusFilter=v;
  document.querySelectorAll('#taskFilters .fb').forEach(b=>{ if(['Todos','Pendientes','Completados'].includes(b.textContent)) b.classList.remove('active'); });
  btn.classList.add('active'); applyFilters();
}
function fResp(r){
  if(respFilter===r){ respFilter=null; document.querySelectorAll('#taskFilters .fb').forEach(b=>b.classList.remove('active')); document.querySelector('#taskFilters .fb').classList.add('active'); }
  else{ respFilter=r; document.querySelectorAll('#taskFilters .fb').forEach(b=>b.classList.toggle('active',b.textContent===r&&!['Todos','Pendientes','Completados'].includes(b.textContent))); }
  applyFilters();
}
function applyFilters(){
  document.querySelectorAll('.task').forEach(el=>{
    const done=el.dataset.done==='1',resp=el.dataset.resp;
    let show=true;
    if(statusFilter==='pendientes'&&done)show=false;
    if(statusFilter==='hechos'&&!done)show=false;
    if(respFilter&&resp!==respFilter)show=false;
    el.classList.toggle('hidden',!show);
  });
}
function updateSectionCount(sid){
  const sec=SECTIONS.find(s=>s.id===sid); if(!sec) return;
  const done=sec.tasks.filter((_,i)=>isTaskDone(sid,i)).length;
  const el=document.getElementById(sid+'_count'); if(el) el.textContent=`${done}/${sec.tasks.length}`;
}
function updateStats(){
  let tot=0,done=0,alta=0;
  SECTIONS.forEach(s=>{ s.tasks.forEach((t,i)=>{ tot++; if(isTaskDone(s.id,i))done++; if(t.prio==='alta')alta++; }); });
  document.getElementById('sTotal').textContent=tot;
  document.getElementById('sDone').textContent=done;
  document.getElementById('sPend').textContent=tot-done;
  document.getElementById('sAlta').textContent=alta;
  const open=COMMENTS.filter(c=>c.status==='abierto').length;
  document.getElementById('sOpenCom').textContent=open;
  const pct=tot>0?Math.round(done/tot*100):0;
  document.getElementById('globalBar').style.width=pct+'%';
  document.getElementById('globalPct').textContent=pct+'%';
  const b=document.getElementById('comBadge');
  b.textContent=open; b.style.display=open>0?'inline':'none';
}

function addComment(){

  const newComment = {
    id: uniqueId,

    area: document.getElementById('ncArea').value,
    resp: document.getElementById('ncResp').value,
    prio: document.getElementById('ncPrio').value,
    texto: txt,
    status: 'abierto',
    res: '',
    fechaRes: ''
  };
  COMMENTS.unshift(newComment);

  saveComments();
  syncToSupabase(); // Force sync immediately
  renderComments();
  updateStats();
}
function setComStatus(id,val){
  const c=COMMENTS.find(x=>x.id===id); if(!c) return;

function renderComments(){
  const cont=document.getElementById('comContainer'); if(!cont) return;
  const list=COMMENTS.filter(c=>{ if(comFilter==='all')return true; if(comFilter==='alta')return c.prio==='alta'; return c.status===comFilter; });
  const cc=document.getElementById('comCount'); if(cc) cc.textContent=list.length?list.length+' comentario'+(list.length===1?'':'s'):'';
  if(!list.length){ cont.innerHTML='<div class="com-empty">'+(COMMENTS.length===0?'📝 Sin comentarios aún.':'Sin comentarios con este filtro.')+'</div>'; return; }
  cont.innerHTML='';
  list.forEach(c=>{
    const cls=c.status==='resuelto'?' rc':c.status==='en_proceso'?' pc':' oc';
    const pb=c.prio==='alta'?'<span class="tag tag-alta">🔴 Alta</span>':c.prio==='media'?'<span class="tag tag-media">🟡 Media</span>':'<span class="tag tag-baja">🟢 Baja</span>';
    const so=['abierto','en_proceso','resuelto'].map(s=>`<option value="${s}"${c.status===s?' selected':''}>${s==='abierto'?'🔴 Abierto':s==='en_proceso'?'🟡 En proceso':'✅ Resuelto'}</option>`).join('');
    const el=document.createElement('div'); el.className='com-card'+cls;
    el.innerHTML=`
      <div class="com-hdr">
        <span class="com-date">📅 ${c.fecha}</span>
        <span style="font-size:11px;color:var(--dim)">${c.area}</span>
        ${pb}<span style="font-size:11px;color:var(--dim)">👤 ${c.resp}</span>
        <select class="com-ss" onchange="setComStatus('${c.id}',this.value)">${so}</select>
        <button class="btn-d" onclick="deleteComment('${c.id}')">✕</button>
      </div>
      <div class="com-body">
        <div class="com-txt" id="etxt_${c.id}">${c.texto.replace(/</g,'&lt;')}</div>
        <textarea class="com-edit-ta" id="eta_${c.id}"></textarea>
        ${c.res?`<div class="com-resolve">✅ ${c.res}${c.fechaRes?' ('+c.fechaRes+')':''}</div>`:''}
        <input class="com-res-inp" value="${(c.res||'').replace(/"/g,'&quot;')}" placeholder="¿Cómo se resolvió? Escribe aquí cuando lo cierres..." onchange="setComRes('${c.id}',this.value)">
        <div class="com-actions">
          <button class="btn-e" id="be_${c.id}" onclick="startEdit('${c.id}')">✏️ Editar</button>
          <button class="btn-s" id="bs_${c.id}" onclick="saveEdit('${c.id}')">Guardar</button>
          <button class="btn-c" id="bc_${c.id}" onclick="cancelEdit('${c.id}')">Cancelar</button>
        </div>
      </div>`;
    cont.appendChild(el);
  });
}

function cellStyle(bg, fg, bold, wrapText, sz){
  return {
    font:{ name:'Arial', sz:sz||9, bold:!!bold, color:{rgb:fg||'F0EBE0'} },
    fill:{ patternType:'solid', fgColor:{rgb:bg||'1A1916'} },
    alignment:{ vertical:'top', wrapText:!!wrapText },
    border:{
      top:{style:'thin',color:{rgb:'2E2C28'}},
      bottom:{style:'thin',color:{rgb:'2E2C28'}},
      left:{style:'thin',color:{rgb:'2E2C28'}},
      right:{style:'thin',color:{rgb:'2E2C28'}}
    }
  };
}
function applyStyle(ws, r, c, style){
  const addr = window.XLSX.utils.encode_cell({r,c});
  if(!ws[addr]) ws[addr]={v:'',t:'s'};
  ws[addr].s = style;
}
function applyRowStyle(ws, r, cols, style){
  for(let c=0;c<cols;c++) applyStyle(ws,r,c,style);
}
function setCell(ws, r, c, val, style){
  const addr = window.XLSX.utils.encode_cell({r,c});
  ws[addr] = {v:val, t:typeof val==='number'?'n':'s', s:style};
  if(!ws['!ref']){ws['!ref']=addr;}
  else{
    const range=window.XLSX.utils.decode_range(ws['!ref']);
    const cr=window.XLSX.utils.decode_cell(addr);
    if(cr.r<range.s.r)range.s.r=cr.r; if(cr.c<range.s.c)range.s.c=cr.c;
    if(cr.r>range.e.r)range.e.r=cr.r; if(cr.c>range.e.c)range.e.c=cr.c;
    ws['!ref']=window.XLSX.utils.encode_range(range);
  }
}

function exportExcel(){
  if(!window.XLSX) {
    alert('Error: Librería no cargó. Recarga la página e intenta de nuevo.');
    return;
  }
  
  // Get data from app
  const sections = SECTIONS.map(sec=>({
    date: sec.date,
    title: sec.title,
    hora: getHora(sec.id)||'',
    tasks: sec.tasks.map((t,i)=>({text:t.text,note:t.note||'',resp:t.resp||'',prio:t.prio||'',cat:t.cat||'',done:isTaskDone(sec.id,i)}))
  }));
  
  let tot=0,done=0,alta=0;
  SECTIONS.forEach(s=>s.tasks.forEach((t,i)=>{ tot++; if(isTaskDone(s.id,i))done++; if(t.prio==='alta')alta++; }));
  const openC=COMMENTS.filter(c=>c.status==='abierto').length;
  const enProc=COMMENTS.filter(c=>c.status==='en_proceso').length;
  const resuC=COMMENTS.filter(c=>c.status==='resuelto').length;
  
  const wb = XLSX.utils.book_new();
  
  // Sheet 1: TAREAS
  const taskData = [['FECHA','HORARIO','SECCION','TAREA','NOTA','RESPONSABLE','PRIORIDAD','CATEGORIA','ESTADO']];
  sections.forEach(sec=>{
    sec.tasks.forEach(t=>{
      taskData.push([
        sec.date,
        sec.hora||'',
        sec.title,
        t.text,
        t.note,
        t.resp,
        t.prio,
        t.cat,
        t.done?'LISTO':'PENDIENTE'
      ]);
    });
  });
  const ws1 = XLSX.utils.aoa_to_sheet(taskData);
  ws1['!cols'] = [{wch:14},{wch:24},{wch:26},{wch:60},{wch:35},{wch:14},{wch:10},{wch:12},{wch:14}];
  XLSX.utils.book_append_sheet(wb, ws1, 'Tareas');
  
  // Sheet 2: COMENTARIOS
  const comData = [['FECHA','AREA','COMENTARIO','RESPONSABLE','ESTADO','F.RESOLUCION','COMO SE RESOLVIO','PRIORIDAD']];
  COMMENTS.forEach(c=>{
    comData.push([c.fecha, c.area, c.texto, c.resp, c.status, c.fechaRes||'', c.res||'', c.prio]);
  });
  const ws2 = XLSX.utils.aoa_to_sheet(comData);
  ws2['!cols'] = [{wch:12},{wch:20},{wch:70},{wch:14},{wch:14},{wch:14},{wch:45},{wch:10}];
  XLSX.utils.book_append_sheet(wb, ws2, 'Comentarios');
  
  // Sheet 3: RESUMEN
  const resData = [
    ['TRECC RESUMEN DE ESTADO'],
    ['Exportado',new Date().toLocaleString('es-CO')],
    [''],
    ['TAREAS'],
    ['Total',tot],
    ['Completadas',done],
    ['Pendientes',tot-done],
    ['Alta prioridad',alta],
    ['Avance %',tot>0?Math.round(done/tot*100)+'%':'0%'],
    [''],
    ['COMENTARIOS'],
    ['Total',COMMENTS.length],
    ['Abiertos',openC],
    ['En proceso',enProc],
    ['Resueltos',resuC]
  ];
  const ws3 = XLSX.utils.aoa_to_sheet(resData);
  ws3['!cols'] = [{wch:28},{wch:16}];
  XLSX.utils.book_append_sheet(wb, ws3, 'Resumen');
  
  // Download
  const fecha = new Date().toISOString().slice(0,10);
  XLSX.writeFile(wb, 'TRECC_Produccion_'+fecha+'.xlsx');
}
